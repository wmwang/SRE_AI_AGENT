groups:
  - name: "web-frontend_slo_recording_rules"
    rules:
      - record: "slo:slo_1:latency_p99"
        expr: "histogram_quantile(0.99, sum(rate(web-frontend_latency_sli_bucket{service=\"web-frontend\"}[5m])) by (le))"
      - record: "slo:slo_2:latency_p99"
        expr: "histogram_quantile(0.99, sum(rate(web-frontend_latency_sli_bucket{service=\"web-frontend\"}[5m])) by (le))"
      - record: "slo:slo_3:error_rate"
        expr: "sum(rate(web-frontend_errors_sli_errors_total{service=\"web-frontend\"}[5m])) / sum(rate(web-frontend_errors_sli_total{service=\"web-frontend\"}[5m]))"
  - name: "web-frontend_slo_alert_rules"
    rules:
      - alert: "SLO_Frontend_Latency_Breached"
        expr: "slo:slo_1:latency_p99 > 250"
        for: "5m"
        labels:
          severity: "warning"
          slo_id: "slo-1"
          golden_signal: "Latency"
        annotations:
          summary: "SLO Frontend Latency 已違反"
          description: "Frontend Latency 的目標是 95%，但目前已超出閾值。"
      - alert: "SLO_Backend_Latency_Breached"
        expr: "slo:slo_2:latency_p99 > 350"
        for: "5m"
        labels:
          severity: "warning"
          slo_id: "slo-2"
          golden_signal: "Latency"
        annotations:
          summary: "SLO Backend Latency 已違反"
          description: "Backend Latency 的目標是 95%，但目前已超出閾值。"
      - alert: "SLO_Error_Rate_Breached"
        expr: "slo:slo_3:error_rate > 0.02"
        for: "5m"
        labels:
          severity: "warning"
          slo_id: "slo-3"
          golden_signal: "Errors"
        annotations:
          summary: "SLO Error Rate 已違反"
          description: "Error Rate 的目標是 98%，但目前已超出閾值。"
      - alert: "SLO_Traffic_Volume_Breached"
        expr: "slo:slo_4:availability < 12"
        for: "5m"
        labels:
          severity: "warning"
          slo_id: "slo-4"
          golden_signal: "Traffic"
        annotations:
          summary: "SLO Traffic Volume 已違反"
          description: "Traffic Volume 的目標是 1200%，但目前已超出閾值。"
      - alert: "SLO_CPU_Utilization_Breached"
        expr: "slo:slo_5:availability < 0.7"
        for: "5m"
        labels:
          severity: "warning"
          slo_id: "slo-5"
          golden_signal: "Saturation"
        annotations:
          summary: "SLO CPU Utilization 已違反"
          description: "CPU Utilization 的目標是 70%，但目前已超出閾值。"
